<!doctype html>
<html lang="en">
  <head>
    <title>Petdle</title>
    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dist/script.css" />
    <script type="module" src="dist/script.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <span id="page-title">PETDLE</span>
    <button id="theme-button" aria-label="Theme: auto. Click to change.">
      🖥
    </button>
    <button id="help-button" aria-label="How to play">?</button>
    <dialog id="help-dialog">
      <h2>How to play</h2>
      <p>Guess the pet of the day. Each guess shows how close you are:</p>
      <div class="help-example row">
        <div class="cell guess-result-cell correct">Rex</div>
        <div class="cell guess-result-cell incorrect">Rex</div>
      </div>
      <p><b>Green</b>: exact match. <b>Red</b>: no match.</p>
      <div class="help-example row">
        <div class="cell guess-result-cell partially-correct">Brown, White</div>
      </div>
      <p>
        <b>Orange</b>: a list (colors, owners) where some, but not all, items
        match.
      </p>
      <p>A new pet appears every day.</p>
      <form method="dialog"><button>CLOSE</button></form>
    </dialog>
    <div id="game-container">
      <div id="new-guess-row" class="row">
        <input type="text" id="new-guess-input" />
        <button id="submit-new-guess-button">SUBMIT</button>
      </div>
      <div id="guess-results-titles-row" class="row">
        <div class="guess-result-title cell">Photo</div>
        <div class="guess-result-title cell">Name</div>
        <div class="guess-result-title cell">Colors</div>
        <div class="guess-result-title cell">Owners</div>
      </div>
      <div id="guess-results-container"></div>
    </div>
  </body>
</html>
