<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Guessdle: daily guessing games</title>
    <meta
      name="description"
      content="A new guessing game every day: pick a game and work out the mystery answer."
    />

    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/dist/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/dist/gallery.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="page page-wide">
      <div class="page-head">
        <h1>Pick a game</h1>
        <p class="lede">
          A new mystery every day in each game. New to this?
          <a href="/how-to-play">How to play</a>
        </p>
        <p>
          <a id="create-link" class="btn btn-primary" href="/create"
            >Create a game</a
          >
        </p>
      </div>
      <p id="gallery-error" class="alert alert-warn" role="status" hidden>
        Could not load the games. Your connection may be down or the server may
        have a problem. Refresh the page; if it keeps failing, try again in a
        few minutes.
      </p>
      <p id="gallery-loading" class="empty-state">Loading games…</p>
      <ul id="gallery" class="gallery"></ul>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
