# Prod on the home server: ./start.sh. Needs .env with TUNNEL_TOKEN (see .env.example).
services:
  web:
    build:
      context: .
      target: prod
    restart: unless-stopped

  # Cloudflare Tunnel; in the dashboard point the public hostname at http://web:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - web
    restart: unless-stopped
