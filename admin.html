<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Admin - Guessdle</title>
    <meta name="description" content="Guessdle admin: users and backups." />
    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/dist/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/dist/admin.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="page page-wide">
      <section id="admin-gate" class="card auth-card center" aria-live="polite">
        <p id="gate-loading" class="lede">Checking your access…</p>
        <div id="gate-signed-out" hidden>
          <h1>Sign in required</h1>
          <p class="lede">The admin area is for signed-in administrators.</p>
          <a class="btn btn-primary" href="/login">Sign in</a>
        </div>
        <div id="gate-forbidden" hidden>
          <h1>403: no access</h1>
          <p class="lede">Your account is not an administrator.</p>
          <a class="btn btn-primary" href="/">Back to the game</a>
        </div>
      </section>
      <div id="admin-app" hidden>
        <div class="page-head">
          <h1>Admin</h1>
        </div>
        <div
          id="admin-tabs"
          class="tabs"
          role="tablist"
          aria-label="Admin sections"
        >
          <button
            type="button"
            role="tab"
            id="tab-users"
            aria-selected="true"
            aria-controls="users-panel"
          >
            Users
          </button>
          <button
            type="button"
            role="tab"
            id="tab-backup"
            aria-selected="false"
            aria-controls="backup-panel"
            tabindex="-1"
          >
            Backups
          </button>
        </div>
        <section
          id="backup-panel"
          class="card"
          role="tabpanel"
          aria-labelledby="tab-backup"
          hidden
        >
          <h2>Backups</h2>
          <p id="backup-status" class="backup-status" role="status"></p>
          <ul id="backup-reasons"></ul>
        </section>
        <section
          id="users-panel"
          class="card"
          role="tabpanel"
          aria-labelledby="tab-users"
        >
          <h2>Users</h2>
          <p
            id="users-message"
            class="alert alert-warn"
            role="status"
            hidden
          ></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Last seen</th>
                  <th>Role</th>
                  <th><span class="sr-only">Action</span></th>
                </tr>
              </thead>
              <tbody id="admin-users"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
