<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing you in - Guessdle</title>
    <meta name="description" content="Finishing your Guessdle sign-in." />
    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/dist/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/dist/verify.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="page page-narrow" aria-live="polite">
      <section class="card auth-card center">
        <div id="verify-working">
          <span class="spinner" aria-hidden="true"></span>
          <h1>Signing you in…</h1>
          <p class="lede">One moment, then we take you to the game.</p>
        </div>
        <div id="verify-failed" hidden>
          <h1>This link did not work</h1>
          <p id="verify-reason" class="lede"></p>
          <a id="verify-new" class="btn btn-primary" href="/login"
            >Get a new link</a
          >
          <a id="verify-retry" class="btn btn-primary" href="" hidden
            >Try again</a
          >
        </div>
      </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
