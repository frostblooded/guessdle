<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Create a game - Guessdle</title>
    <meta name="description" content="Start your own Guessdle game." />
    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/src/pages/create.ts"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="page page-narrow">
      <div class="page-head">
        <h1>Create a game</h1>
        <p class="lede">
          Name it now. It starts as a draft only you can see, and you add the
          rest in the editor.
        </p>
      </div>
      <form id="create-form" class="card" novalidate>
        <label class="field-label" for="game-name">Game name</label>
        <input
          type="text"
          id="game-name"
          maxlength="60"
          autocomplete="off"
          required
        />
        <label class="field-label" for="game-slug">Web address</label>
        <div class="slug-row">
          <span class="fine-print">/g/</span>
          <input
            type="text"
            id="game-slug"
            maxlength="40"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <p class="fine-print">
          3 to 40 letters, numbers or dashes. It cannot be changed after you
          create the game.
        </p>
        <p id="create-error" class="alert alert-error" role="alert"></p>
        <button id="create-button" class="btn btn-primary" type="submit">
          Create game
        </button>
      </form>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
