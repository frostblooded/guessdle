# Flood limits (starting values, tune after launch; docs/deploy.md)
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 8080;
  root /usr/share/nginx/html;
  # Unknown paths get the app shell with a 404 status; the app shows its not-found page
  error_page 404 /index.html;
  limit_req_status 429;

  # The real client IP comes from the tunnel's header, trusted only from private networks
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  # Revalidate unhashed files (the app shell) on every load
  add_header Cache-Control "no-cache";

  # dist/ file names carry a content hash (ADR 0007), so they never change
  location /dist/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Processed images from the uploads volume (random names, never rewritten)
  location /uploads/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app's routes (src/App.tsx; scripts/server.mjs lists the same ones) get the shell
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(login|verify|admin|how-to-play|create|my-games)$ {
    try_files /index.html =404;
  }

  # Anything else is a real file (favicon.ico) or a 404
  location / {
    try_files $uri =404;
  }

  # Game shell: the API serves /g/<slug> with the game's link-preview meta injected
  # and a real 404 status for unknown or unplayable games
  location ~ ^/g/[^/]+$ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Editor: the shell, like the other app routes
  location ~ ^/g/[^/]+/edit$ {
    try_files /index.html =404;
  }

  # The API container, on the private network (same origin for the browser)
  # Image uploads (5 MB cap; the API re-checks)
  location = /api/uploads {
    client_max_body_size 5m;
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /api/ {
    client_max_body_size 10k;
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Sign-in mail routes: tighter
  location /api/auth/email {
    client_max_body_size 10k;
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The shell only through the routes above, never as /index.html
  location = /index.html {
    internal;
  }
}
