# Flood limits (starting values, tune after launch; docs/deploy.md)
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# A party's phones often share one room's IP
limit_req_zone $binary_remote_addr zone=party:10m rate=600r/m;
# Access log without query strings or referers: the emailed sign-in link carries its token in
# /verify?token=, and the Server logs workflow prints this log in public Actions runs
map $request_uri $request_path {
  ~^(?<path>[^?]*) $path;
}
log_format noquery '$remote_addr - [$time_local] "$request_method $request_path $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
  listen 8080;
  access_log /var/log/nginx/access.log noquery;
  root /usr/share/nginx/html;
  # Unknown paths get the app shell with a 404 status; the app shows its not-found page
  error_page 404 /index.html;
  limit_req_status 429;

  # The real client IP comes from the tunnel's header, trusted only from private networks
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  # Forced maintenance, for when the API itself is down: 1 = on, 0 = off (the admin panel toggle
  # then decides, through the API). While on, only / and its assets load, other pages redirect
  # to /, the API answers 503, and /api/maintenance tells the app to show the maintenance page.
  set $maintenance_forced 0;
  # Relative Location, so the redirect keeps the tunnel's public host and scheme
  absolute_redirect off;
  set $maintenance $maintenance_forced;
  if ($uri ~ ^/(dist/.+|favicon\.ico|api/maintenance)$) {
    set $maintenance 0;
  }
  if ($uri = /) {
    set $maintenance 0;
  }
  if ($uri ~ ^/api/) {
    set $maintenance "${maintenance}api";
  }
  if ($maintenance = 1) {
    return 302 /;
  }
  if ($maintenance = 1api) {
    return 503;
  }

  # Revalidate unhashed files (the app shell) on every load
  add_header Cache-Control "no-cache";

  # dist/ file names carry a content hash (ADR 0007), so they never change
  location /dist/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Processed images from the uploads volume (random names, never rewritten)
  location /uploads/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app's routes (src/App.tsx; scripts/server.mjs lists the same ones) get the shell
  location = / {
    try_files /index.html =404;
  }
  location ~ ^/(login|verify|admin|how-to-play|create|my-games|profile|settings|friends)$ {
    try_files /index.html =404;
  }

  # Profiles and playlists: /u/<username>, /p/<id> and /p/<id>/edit are app routes
  location ~ ^/(u/[a-z0-9_]+|p/[0-9]+(/edit)?)$ {
    try_files /index.html =404;
  }

  # Anything else is a real file (favicon.ico) or a 404
  location / {
    try_files $uri =404;
  }

  # Game shell: the API serves /g/<slug> with the game's link-preview meta injected
  # and a real 404 status for unknown or unplayable games
  location ~ ^/g/[^/]+$ {
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Editor: the shell, like the other app routes
  location ~ ^/g/[^/]+/edit$ {
    try_files /index.html =404;
  }

  # Past days: the list and one archive day, app routes like the editor
  location ~ ^/g/[^/]+/(days|day/[0-9]+)$ {
    try_files /index.html =404;
  }

  # Party page: /party and /party/<CODE> are app routes (the page reads the code)
  location ~ ^/party(/[A-Za-z]+)?$ {
    try_files /index.html =404;
  }

  # Party sockets (ADR 0016): WebSocket upgrade, held open while the party plays
  location ~ ^/api/parties/[^/]+/socket$ {
    limit_req zone=party burst=200 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # The rest of a party's API (state, join): looser, like its socket
  location ~ ^/api/parties/ {
    client_max_body_size 10k;
    limit_req zone=party burst=200 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Maintenance state for the app; answered here while forced, so it works with the API down
  location = /api/maintenance {
    default_type application/json;
    if ($maintenance_forced = 1) {
      add_header Cache-Control "no-store" always;
      return 200 '{"on":true,"forced":true}';
    }
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The API container, on the private network (same origin for the browser)
  # Image uploads (5 MB cap; the API re-checks)
  location = /api/uploads {
    client_max_body_size 5m;
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /api/ {
    client_max_body_size 10k;
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Sign-in mail routes: tighter
  location /api/auth/email {
    client_max_body_size 10k;
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # The shell only through the routes above, never as /index.html
  location = /index.html {
    internal;
  }
}
