server {
  listen 8080;
  root /usr/share/nginx/html;
  error_page 404 /404.html;

  # Revalidate unhashed files (index.html, 404.html, photos) on every load
  add_header Cache-Control "no-cache";

  # dist/ file names carry a content hash (ADR 0007), so they never change
  location /dist/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The API container, on the private network (same origin for the browser)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /404.html {
    internal;
  }
}
