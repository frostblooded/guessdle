# Prod on the home server: ./start.sh. The host's cloudflared tunnel points at http://guessdle-server:8080.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: prod
    container_name: guessdle-server
    networks:
      - tunnel
    restart: unless-stopped

# Network shared with cloudflared (created by the immich stack, so immich must be up first)
networks:
  tunnel:
    name: immich_default
    external: true
