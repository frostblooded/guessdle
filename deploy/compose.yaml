# Dev: docker compose up --watch  (http://localhost:8080)
services:
  dev:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: sync
          path: ..
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/
        - action: rebuild
          path: ../package.json
        - action: rebuild
          path: ../package-lock.json
