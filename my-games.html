<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>My games - Guessdle</title>
    <meta name="description" content="Games you created on Guessdle." />
    <script>
      // Set before first paint so a stored choice never flashes the other theme (ADR 0006)
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/dist/styles.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/dist/my-games.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="page">
      <div class="page-head">
        <h1>My games</h1>
        <p><a class="btn btn-primary" href="/create">Create a game</a></p>
      </div>
      <p id="mine-error" class="alert alert-warn" role="status" hidden>
        Could not load your games. Your connection may be down or the server may
        have a problem. Refresh the page; if it keeps failing, try again in a
        few minutes.
      </p>
      <p id="mine-loading" class="empty-state">Loading your games…</p>
      <p id="mine-empty" class="empty-state" hidden>
        You have not created a game yet.
      </p>
      <ul id="mine" class="mine-list"></ul>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
