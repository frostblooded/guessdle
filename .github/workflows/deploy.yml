name: Build and deploy

on:
  push:
    branches: [master, prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pages only redirects to the home server (ADR 0005).
      - name: Assemble deploy folder
        run: |
          mkdir _site
          cp deploy/redirect.html _site/index.html
          cp deploy/redirect.html _site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile --target dev .
      - run: docker build -f Dockerfile --target prod .
      # Loads every module the API imports, so a file the image does not copy fails here, not on prod
      - name: API image loads
        run: |
          docker build -f Dockerfile --target api -t guessdle-api .
          docker run --rm guessdle-api node -e 'await import("./src/server/main.ts")'

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Duplicate code
        run: npm run dup
      - name: Compile, type-check and run unit tests
        run: npm test

  # Needs Docker (Testcontainers Postgres), which the runner has
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  # Split over two runners; each half starts its own server and Postgres
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

  deploy:
    needs: [build, unit, integration, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-home:
    needs: [build, unit, integration, e2e]
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: [self-hosted, home-server]
    concurrency:
      group: deploy-home
      cancel-in-progress: false
    steps:
      # Runs in the server's existing clone, not the runner workspace: start.sh does git pull --ff-only.
      - run: ./deploy/start.sh
        working-directory: ${{ vars.DEPLOY_DIR }}
