name: Build and deploy

on:
  push:
    branches: [master, prod]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile --target dev .
      - run: docker build -f Dockerfile --target prod .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Duplicate code
        run: npm run dup
      - name: Compile, type-check and run unit tests
        run: npm test

  # Needs Docker (Testcontainers Postgres), which the runner has
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  # Split over two runners; each half starts its own server and Postgres
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

  deploy-home:
    needs: [unit, integration, e2e]
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: [self-hosted, home-server]
    concurrency:
      group: deploy-home
      cancel-in-progress: false
    steps:
      # Runs in the server's existing clone, not the runner workspace: start.sh does git pull --ff-only.
      - run: ./deploy/start.sh
        working-directory: ${{ vars.DEPLOY_DIR }}
