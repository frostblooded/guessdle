name: Server logs

# Prints the prod stack's state and recent logs from the home server, for when nobody can SSH in.
# The repo is public, so anyone can read this run's log: emails are masked; delete the run when
# done (docs/deploy.md).
on:
  workflow_dispatch:
    inputs:
      lines:
        description: Log lines per service
        default: "200"

permissions:
  contents: read

jobs:
  logs:
    runs-on: [self-hosted, home-server]
    steps:
      - working-directory: ${{ vars.DEPLOY_DIR }}
        env:
          LINES: ${{ inputs.lines }}
        run: |
          dc() { docker compose -f deploy/compose.prod.yaml "$@"; }
          redact() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<email>/g'; }
          echo "::group::Containers"; dc ps -a; echo "::endgroup::"
          echo "::group::API health"; dc exec -T web wget -qO- http://api:3000/api/health || true; echo; echo "::endgroup::"
          for s in api web db; do
            echo "::group::$s logs"; dc logs --no-color --tail "$LINES" "$s" 2>&1 | redact; echo "::endgroup::"
          done
